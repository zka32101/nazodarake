name: nazodarake
description: "なぞだらけ - 謎解きゲームアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  share_plus: ^10.1.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icon/

# flutter_launcher_icons の設定。
# 本番リリース前に assets/icon/icon.png (1024x1024 PNG) を
# デザイナー作成の実画像へ差し替えたうえで
# `dart run flutter_launcher_icons` を実行してください。
# 詳細は assets/icon/README.md を参照。
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon/icon.png'
  min_sdk_android: 21
  remove_alpha_ios: true

# flutter_native_splash の設定。
# 本番リリース前に assets/icon/splash.png を実画像へ差し替えたうえで
# `dart run flutter_native_splash:create` を実行してください。
flutter_native_splash:
  color: '#FFFFFF'
  image: 'assets/icon/splash.png'
  android_12:
    color: '#FFFFFF'
    image: 'assets/icon/splash.png'
